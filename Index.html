<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Berlin Word Blaster</title>
<style>
  :root {
    --sky1: #4db7ff;
    --sky2: #b8e8ff;
    --navy: #16325c;
    --gold: #ffd24a;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  button { touch-action: manipulation; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: #0b1b33;
    touch-action: none;
  }
  #app {
    position: relative; width: 100%; height: 100%;
    max-width: 520px; margin: 0 auto;
    background: linear-gradient(#47b6ff 0%, #9ad8ff 42%, #7ec56a 70%, #5aa24c 100%);
    overflow: hidden;
  }
  .hud {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; align-items: center; gap: 8px; z-index: 20;
  }
  .pill {
    background: linear-gradient(#2b6cff, #1c4ec7);
    color: #fff; border-radius: 16px; padding: 6px 10px;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 3px 0 #12357a; font-weight: 800; font-size: 15px;
  }
  .stage-pill {
    flex: 1; justify-content: center;
    background: linear-gradient(#ffd45c, #f5b400);
    color: #3a2500; box-shadow: 0 3px 0 #c48a00;
  }
  .pause-btn {
    width: 40px; height: 40px; border: 0; border-radius: 12px;
    background: linear-gradient(#3aa0ff, #1b6ad6); color: #fff;
    font-size: 18px; box-shadow: 0 3px 0 #114a9a;
  }
  .prompt {
    position: absolute; top: 58px; left: 18px; right: 18px; z-index: 20;
    background: #fff; border: 5px solid #2f7dff; border-radius: 28px;
    text-align: center; padding: 8px 12px 10px;
    box-shadow: 0 6px 0 #1a4fb3;
  }
  .prompt .en { font-size: 28px; font-weight: 900; color: #16325c; }
  .place {
    position: absolute; top: 128px; left: 0; right: 0; z-index: 8;
    text-align: center; color: #fff; font-weight: 800;
    text-shadow: 0 2px 6px #0a3a70; font-size: 13px;
  }
  .sky-deco { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .sun { position: absolute; right: 16px; top: 150px; font-size: 42px; }
  .castle {
    position: absolute; left: 50%; bottom: 168px; transform: translateX(-50%);
    font-size: 72px; z-index: 2; filter: drop-shadow(0 8px 0 rgba(0,0,0,.15));
  }
  .balloons { position: absolute; left: 0; right: 0; top: 168px; z-index: 10; height: 210px; }
  .balloon {
    position: absolute; width: 92px; text-align: center; cursor: pointer;
    animation: float 2.4s ease-in-out infinite;
  }
  .balloon .body {
    width: 92px; height: 108px; border-radius: 50% 50% 46% 46%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 15px; line-height: 1.15;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.12), 0 8px 0 rgba(0,0,0,.12);
    padding: 8px;
  }
  .balloon .string { width: 2px; height: 28px; background: #666; margin: 0 auto; }
  .b0 .body { background: linear-gradient(#4ea6ff, #1d6adf); }
  .b1 .body { background: linear-gradient(#ff6aa8, #e1236d); }
  .b2 .body { background: linear-gradient(#54d36a, #1ea03a); }
  .b3 .body { background: linear-gradient(#b06bff, #7a2de0); }
  .pop { animation: pop .28s forwards !important; }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes pop { to { transform: scale(1.4); opacity: 0; } }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 5;
    background: linear-gradient(#7ed15f, #4ea43b);
  }
  .boy {
    position: absolute; bottom: 18px; z-index: 12;
    width: 92px; text-align: center; font-size: 62px;
    transition: left .08s linear;
  }
  .gun { font-size: 28px; margin-top: -18px; }
  .rocket {
    position: absolute; z-index: 15; font-size: 28px;
    pointer-events: none; display: none;
  }
  .stand { position: absolute; right: 8px; bottom: 18px; z-index: 6; font-size: 54px; }
  #title, #pause, #over, #win {
    position: absolute; inset: 0; z-index: 40;
    background: linear-gradient(#47b6ff, #8fd0ff 45%, #6ec75a);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  #pause, #over, #win { display: none; background: rgba(10,30,60,.78); color: #fff; }
  h1 {
    margin: 8px 0 4px; font-size: 34px; color: #fff;
    text-shadow: 0 4px 0 #1a4ea8, 0 8px 16px rgba(0,0,0,.25);
  }
  .sub { color: #16325c; font-weight: 800; margin-bottom: 16px; }
  .big-art { font-size: 88px; line-height: 1; }
  button.play {
    margin-top: 12px; border: 0; border-radius: 18px;
    padding: 14px 28px; font-size: 22px; font-weight: 900;
    background: linear-gradient(#ffd45c, #f5b400); color: #3a2500;
    box-shadow: 0 5px 0 #c48a00;
    touch-action: manipulation;
    z-index: 50;
    position: relative;
  }
  button.ghost {
    margin-top: 10px; border: 0; border-radius: 14px;
    padding: 10px 18px; font-weight: 800; color: #fff;
    background: #2b6cff;
  }
  .hint { color: #16325c; font-size: 14px; font-weight: 700; max-width: 320px; }
</style>
</head>

  <div class="boy" id="boy">👦<div class="gun">🔫</div></div>

    <p class="hint">Read the English word. Shoot the matching German balloon. Wrong balloon costs a heart.</p>
    <button class="play" id="startBtn" type="button">▶ Play</button>
  </div>
  <div id="pause">
    <h1>Paused</h1>
    <button class="play" id="resumeBtn">Resume</button>
  </div>
  <div id="over">
    <h1>No hearts left</h1>

  </div>
  <div id="win">

    <button class="play" id="againBtn">Play again</button>
  </div>
</div>

const STAGES = window.STAGES;
const COLORS = ["b0","b1","b2","b3"];
let hearts = 3, stars = 0, index = 0, busy = false;
const boy = document.getElementById("boy");
const rocket = document.getElementById("rocket");
const app = document.getElementById("app");
let boyX = 160;

function save(){ localStorage.setItem("bwb", JSON.stringify({hearts,stars,index})); }
function load(){
  try {
    const s = JSON.parse(localStorage.getItem("bwb")||"{}");
    if (typeof s.index === "number") { hearts = s.hearts ?? 3; stars = s.stars ?? 0; index = s.index ?? 0; }
  } catch(e){}
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function setBoy(x){
  const max = app.clientWidth - 92;
  boyX = Math.max(0, Math.min(max, x));
  boy.style.left = boyX + "px";
}
function hud(){
  document.getElementById("hearts").textContent = "❤️".repeat(hearts) + "🤍".repeat(Math.max(0,3-hearts));
  document.getElementById("stars").textContent = "⭐ " + stars;
  const s = STAGES[index] || STAGES[STAGES.length-1];
  document.getElementById("stageLabel").textContent = s.level + " • Stage " + s.n;
}
function loadStage(){
  if (index >= STAGES.length){ document.getElementById("win").style.display="flex"; return; }
  const s = STAGES[index];
  busy = false;
  document.getElementById("prompt").textContent = s.en;
  document.getElementById("place").textContent = s.place;
  hud();
  const words = shuffle([{t:s.ok,ok:true}, ...s.w.map(t=>({t,ok:false}))]);
  const box = document.getElementById("balloons");
  box.innerHTML = "";
  const w = app.clientWidth;
  words.forEach((item,i)=>{
    const el = document.createElement("div");
    el.className = "balloon " + COLORS[i];
    el.style.left = (12 + i*((w-24-92)/3)) + "px";
    el.style.top = (i%2===0?0:28) + "px";
    el.style.animationDelay = (i*0.2)+"s";
    el.innerHTML = '<div class="body">'+item.t+'</div><div class="string"></div>';
    el.onclick = (ev)=>{ ev.stopPropagation(); shoot(el, item.ok); };
    box.appendChild(el);
  });
}
function flyRocket(fromX, toX, toY, done){
  rocket.style.display = "block";
  rocket.style.left = fromX + "px";
  rocket.style.bottom = "90px";
  const start = performance.now();
  const sx = fromX, sy = app.clientHeight - 110;
  function tick(now){
    const p = Math.min(1, (now-start)/380);
    rocket.style.left = (sx + (toX-sx)*p) + "px";
    rocket.style.top = (sy + (toY-sy)*p) + "px";
    rocket.style.bottom = "auto";
    if (p<1) requestAnimationFrame(tick); else { rocket.style.display="none"; done(); }
  }
  requestAnimationFrame(tick);
}
function shoot(el, ok){
  if (busy) return;
  busy = true;
  const r = el.getBoundingClientRect();
  const a = app.getBoundingClientRect();
  setBoy(r.left - a.left - 10);
  flyRocket(boyX+30, r.left-a.left+20, r.top-a.top+20, ()=>{
    el.classList.add("pop");
    if (ok){
      stars += 1;
      index += 1;
      save();
      setTimeout(loadStage, 280);
    } else {
      hearts -= 1;
      save();
      hud();
      if (hearts <= 0){
        document.getElementById("over").style.display = "flex";
      } else {
        busy = false;
      }
    }
  });
}
function pointer(e){
  const x = (e.touches? e.touches[0].clientX : e.clientX);
  const a = app.getBoundingClientRect();
  setBoy(x - a.left - 46);
}
app.addEventListener("pointermove", pointer);
app.addEventListener("touchmove", pointer, {passive:true});

function startGame(){
  const title = document.getElementById("title");
  if(!window.STAGES || !STAGES.length){
    alert("Word list missing. Use the single-file game.");
    return;
  }
  title.style.display="none";
  loadStage();
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("startBtn").addEventListener("touchend", function(e){ e.preventDefault(); startGame(); }, {passive:false});
document.getElementById("pauseBtn").onclick = ()=> document.getElementById("pause").style.display="flex";
document.getElementById("resumeBtn").onclick = ()=> document.getElementById("pause").style.display="none";
document.getElementById("retryBtn").onclick = ()=>{
  hearts = 3; save();
  document.getElementById("over").style.display="none";
  loadStage();
};
document.getElementById("againBtn").onclick = ()=>{
  hearts=3; stars=0; index=0; save();
  document.getElementById("win").style.display="none";
  loadStage();
};
load();
setBoy(app.clientWidth/2-46);
hud();
</script>
