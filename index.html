<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{background:#0c2344;color:#fff;display:flex;align-items:center;justify-content:center}
#app{width:min(430px,100vw);height:100%;max-height:920px;display:flex;flex-direction:column;background:#0b1c36;position:relative}
header{background:linear-gradient(#1a3d6e,#12325c);padding:10px 12px 8px;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between}
.city{display:flex;align-items:center;gap:8px}
.flag{width:36px;height:26px;border-radius:4px;background:linear-gradient(#000 0 33%,#d00 33% 66%,#ffce00 66%)}
.city h1{font-size:13px;letter-spacing:.03em;color:#ffd54f}
.city small{display:block;opacity:.7;font-size:11px}
.stats{display:flex;gap:6px}
.pill{background:#0b2748;border:1px solid #2a5080;border-radius:20px;padding:4px 8px;font-size:12px;min-width:46px;text-align:center;color:#fff}
#muteBtn{cursor:pointer}
.prompt{background:#0e2c55;border:1px solid #2c5a93;border-radius:12px;padding:8px;text-align:center;margin-top:8px}
.prompt .label{font-size:12px;opacity:.85}
.prompt .word{font-size:24px;color:#f4c430;font-weight:800}
.bar{height:5px;background:#0b2748;border-radius:99px;margin-top:7px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ad2ff,#7dffb0)}
.meta{display:flex;justify-content:space-between;font-size:10px;opacity:.75;margin-top:3px}

function tone(freq,dur,type,gain,slide){
  if(!audioCtx) return;
  const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(gain||0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,gain,hp){

  const t=audioCtx.currentTime,n=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate);
  const d=n.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=audioCtx.createBufferSource(); src.buffer=n;

  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.02);
}
function musicTick(){
  if(!musicOn||!audioCtx) return;
  const n=TUNE[musicStep%TUNE.length];
  playNote(n[0],n[1]*.9,"triangle",.032);
  playNote(n[0]/2,n[1]*.9,"sine",.018);
  musicStep++; musicTimer=setTimeout(musicTick,n[1]*1000);
}
function startMusic(){ensureAudio(); if(musicTimer) clearTimeout(musicTimer); musicStep=0; if(musicOn) musicTick();}
function resize(){
  const g=document.getElementById("game");
  W=g.clientWidth; H=g.clientHeight;
  canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize",resize);
function pack(w){
  const art=w[0],de=w[1],en=w[2];
  const spoken=/^(der|die|das)$/i.test(art)?art+" "+de:de;
  return {art,de,en,spoken,label:spoken,emoji:emojiFor(en)};
}
function pickTarget(){
  levelIdx=levelOf(stage);
  const L=LEVELS[levelIdx];
  target=pack(L.words[(stage-1)%100]);
  document.getElementById("prompt").textContent=target.en;
  document.getElementById("cefr").textContent=L.name;
  document.getElementById("levelName").textContent=L.name+" · Neuschwanstein";
  document.getElementById("tipText").textContent=target.spoken+" = "+target.en;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function makeBall(word,color,x,y,r,dir){
  const speed=0.32+levelIdx*0.04;
  return {x,y,vx:dir*speed*(0.7+Math.random()*0.35),vy:-0.35-Math.random()*0.25,word,color,r,popped:false};
}
function spawnBalloons(){
  balloons=[];
  const L=LEVELS[levelIdx];
  const decoys=L.words.filter(w=>w[1]!==target.de);
  shuffle(decoys);
  const set=[L.words[(stage-1)%100],decoys[0],decoys[1]];
  shuffle(set);
  set.forEach((raw,i)=>{
    balloons.push(makeBall(pack(raw), COLORS[i%COLORS.length], 70+i*((W-140)/2), 80+Math.random()*30, 42, i%2?1:-1));
  });
}
let hurtUntil=0;
function resetGame(){score=0;lives=5;streak=0;stage=1;shots=[];particles=[];learned=[];player={x:W/2};hurtUntil=0;updateHud();nextRound();}
function nextRound(){pickTarget();spawnBalloons();shots=[];player.x=W/2;document.getElementById("bar").style.width=((stage-1)/600*100)+"%";document.getElementById("stage").textContent=String(stage);}
function updateHud(){document.getElementById("score").textContent=score;document.getElementById("lives").textContent=lives;document.getElementById("streak").textContent=streak;}
function groundY(){return H-86;}
function playerHitBox(){const gy=groundY(); return {x:player.x-48,y:gy-130,w:100,h:132};}
function fire(){
  if(!running) return;
  shots=[];
  const gy=groundY();
  shots.push({x:player.x+22, y1:gy-62, y2:gy-62, grow:9});
  sfxShoot();
}
function burst(b){
  for(let i=0;i<18;i++) particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.9)*8,life:28+Math.random()*16,color:b.color});
}
function popBalloon(b,ok){
  sfxPop();
  burst(b);
  shake=8;
  speakDe(b.word.spoken);
  if(ok){
    b.popped=true;
    balloons.forEach(x=>{ if(x!==b) { x.popped=true; burst(x); } });
    sfxGood();
    setTimeout(()=>speakDe(target.spoken), 280);
    score+=10+streak*2; streak++; learned.push(target.spoken+" = "+target.en); stage++; updateHud();
    if(stage>600){win();return;}
    setTimeout(nextRound, 1400);
  } else {
    if(b.r>=30 && balloons.filter(x=>!x.popped).length<6){
      b.popped=true;
      const nr=Math.max(24,b.r*0.7);
      const left=makeBall(b.word,b.color,b.x-12,b.y,nr,-1);
      const right=makeBall(b.word,b.color,b.x+12,b.y,nr,1);
      left.vx*=0.7; right.vx*=0.7; left.vy=-2; right.vy=-2;
      balloons.push(left,right);
    } else {
      b.vy=-2.4; b.vx*=-1;
    }
    streak=0; updateHud();
  }
}
function lose(){
  running=false;
  overlay.innerHTML=`<h2>Game Over</h2><p>Score ${score}. Stage ${stage} (${LEVELS[levelOf(stage)].name}).</p><ul class="vocab-list">${learned.slice(-12).map(x=>`<li>${x}</li>`).join("")||"<li>—</li>"}</ul><button class="menu-btn" id="again">Play again</button>`;
  overlay.classList.remove("hidden"); document.getElementById("again").onclick=start;
}
function win(){
  running=false;
  overlay.innerHTML=`<h2>C2 geschafft!</h2><p>All 600 stages. Score ${score}.</p><button class="menu-btn" id="again">Play again</button>`;
  overlay.classList.remove("hidden"); document.getElementById("again").onclick=start;
}
function start(){ensureAudio(); startMusic(); overlay.classList.add("hidden"); resize(); resetGame(); running=true; last=performance.now(); requestAnimationFrame(loop);}
function loop(t){
  if(!running) return;
  const dt=Math.min(32,t-last)/16; last=t;
  const gy=groundY();
  const g=0.07+levelIdx*0.004;
  balloons.forEach(b=>{
    if(b.popped) return;
    b.vy+=g*dt;
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    if(b.x-b.r<8){ b.x=8+b.r; b.vx=Math.abs(b.vx); sfxBounce(); }
    if(b.x+b.r>W-8){ b.x=W-8-b.r; b.vx=-Math.abs(b.vx); sfxBounce(); }
    if(b.y-b.r<8){ b.y=8+b.r; b.vy=Math.abs(b.vy)*0.6; }
    if(b.y+b.r>gy){ b.y=gy-b.r; b.vy=-Math.abs(b.vy); sfxBounce(); }
    const px=player.x, py=gy-50;
    const dx=b.x-px, dy=b.y-py;
    if(performance.now()>hurtUntil && dx*dx+dy*dy<(b.r+18)*(b.r+18)){
      sfxBad(); shake=14; lives--; streak=0; updateHud();
      hurtUntil=performance.now()+1600;
      b.vy=-5; b.vx+=(b.x<px?-2:2);
      if(lives<=0) lose();
    }
  });
  balloons=balloons.filter(b=>!b.popped);
  shots.forEach(s=>{
    s.y2-=s.grow*dt;
    if(s.y2<6) s.dead=true;
    balloons.forEach(b=>{
      if(b.popped) return;
      if(Math.abs(b.x-s.x)<b.r+4 && b.y+b.r>s.y2 && b.y-b.r<s.y1){
        s.dead=true;
        popBalloon(b, b.word.de===target.de);
      }
    });
  });
  shots=shots.filter(s=>!s.dead);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.life--;}); particles=particles.filter(p=>p.life>0);
  if(shake>0) shake--;
  draw(); requestAnimationFrame(loop);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBalloon(b){
  ctx.save(); ctx.translate(b.x,b.y);
  ctx.fillStyle=b.color;
  ctx.beginPath(); ctx.ellipse(0,2,b.r*0.78,b.r,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.3)";
  ctx.beginPath(); ctx.ellipse(-12,-14,8,12,-0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=b.color;
  ctx.beginPath(); ctx.moveTo(-6,b.r); ctx.lineTo(6,b.r); ctx.lineTo(0,b.r+9); ctx.fill();
  ctx.strokeStyle="#334"; ctx.beginPath(); ctx.moveTo(0,b.r+9); ctx.quadraticCurveTo(8,b.r+24,0,b.r+36); ctx.stroke();
  // picture
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(0,-10,18,0,Math.PI*2); ctx.fill();
  ctx.font="22px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(b.word.emoji,0,-9);
  // article + word
  ctx.fillStyle="#fff"; rr(-40,12,80,22,10); ctx.fill();
  ctx.fillStyle="#1a2744"; ctx.font="bold 11px Trebuchet MS,sans-serif";
  ctx.fillText(b.word.label,0,24);
  ctx.restore();
}
function drawPlayer(){
  const x=player.x, gy=groundY();
  ctx.save(); ctx.translate(x, gy);
  ctx.fillStyle="rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.ellipse(2,4,20,6,0,0,Math.PI*2); ctx.fill();

  // red sneakers + white sole
  ctx.fillStyle="#e31c23"; rr(-20,-10,18,9,4); ctx.fill();
  ctx.fillStyle="#e31c23"; rr(4,-8,18,8,4); ctx.fill();
  ctx.fillStyle="#fff"; ctx.fillRect(-20,-3,18,3); ctx.fillRect(4,-2,18,3);
  ctx.fillStyle="#ffd54f"; ctx.fillRect(-6,-8,4,4); ctx.fillRect(18,-6,4,3);

  // white socks
  ctx.fillStyle="#fff"; rr(-16,-18,12,9,3); ctx.fill(); rr(7,-16,12,9,3); ctx.fill();

  // legs
  ctx.fillStyle="#f0c2a0"; rr(-14,-36,10,20,4); ctx.fill(); rr(8,-34,10,20,4); ctx.fill();

  // blue shorts
  ctx.fillStyle="#1e90ff"; rr(-18,-50,16,18,6); ctx.fill(); rr(4,-48,16,18,6); ctx.fill();
  ctx.fillStyle="#1565c0"; ctx.fillRect(-4,-48,10,6);

  // red tee
  ctx.fillStyle="#ef3236"; rr(-20,-76,40,30,8); ctx.fill();
  ctx.fillStyle="#c62828"; ctx.fillRect(-20,-52,40,6);

  // left arm down-forward
  ctx.strokeStyle="#ef3236"; ctx.lineWidth=8; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-16,-66); ctx.quadraticCurveTo(-28,-52,-22,-38); ctx.stroke();
  ctx.fillStyle="#f0c2a0"; ctx.beginPath(); ctx.arc(-22,-34,5,0,Math.PI*2); ctx.fill();

  // right arm holding hook gun
  ctx.strokeStyle="#ef3236";
  ctx.beginPath(); ctx.moveTo(16,-64); ctx.lineTo(26,-50); ctx.stroke();
  ctx.fillStyle="#f0c2a0"; ctx.beginPath(); ctx.arc(28,-48,5,0,Math.PI*2); ctx.fill();

  // orange + silver Pang hook
  ctx.save(); ctx.translate(32,-50); ctx.rotate(-1.15);
  ctx.fillStyle="#ff9f1a"; rr(-8,-8,26,16,5); ctx.fill();
  ctx.fillStyle="#ffc46b"; rr(-4,-6,12,10,3); ctx.fill();
  ctx.fillStyle="#d7dee4"; rr(14,-5,20,10,3); ctx.fill();
  ctx.fillStyle="#9eabb4"; ctx.fillRect(30,-3,6,6);
  ctx.strokeStyle="#f4f7fa"; ctx.lineWidth=3.2; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(36,0); ctx.quadraticCurveTo(48,-10,42,-18); ctx.stroke();
  ctx.fillStyle="#f4f7fa"; ctx.beginPath(); ctx.arc(42,-18,4,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // neck
  ctx.fillStyle="#f0c2a0"; ctx.fillRect(-6,-82,12,8);

  // big head
  ctx.fillStyle="#f0c2a0";
  ctx.beginPath(); ctx.ellipse(0,-104,19,21,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-18,-102,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(18,-102,5,0,Math.PI*2); ctx.fill();

  // black hair fringe
  ctx.fillStyle="#1a1a1a";
  ctx.beginPath(); ctx.ellipse(-12,-112,8,6,-0.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8,-114,7,5,0.3,0,Math.PI*2); ctx.fill();

  // red-white cap
  ctx.fillStyle="#ef3236";
  ctx.beginPath(); ctx.ellipse(0,-118,18,9,0,Math.PI,Math.PI*2); ctx.fill();
  ctx.fillRect(-18,-119,36,7);
  ctx.fillStyle="#fff"; ctx.fillRect(-12,-122,24,5);
  ctx.fillStyle="#b71c1c";
  ctx.beginPath(); ctx.ellipse(8,-114,13,5,-0.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#ffd54f";
  ctx.beginPath(); ctx.arc(-6,-124,3.4,0,Math.PI*2); ctx.fill();

  // huge eyes
  ctx.fillStyle="#fff";
  ctx.beginPath(); ctx.ellipse(-7,-102,6.5,7.8,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8,-102,6.5,7.8,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#111"; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.ellipse(-7,-102,6.5,7.8,0,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(8,-102,6.5,7.8,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle="#111";
  ctx.beginPath(); ctx.arc(-5,-101,3.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(10,-101,3.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath(); ctx.arc(-3.8,-103,1.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(11.2,-103,1.3,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle="#111"; ctx.lineWidth=2.3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-14,-112); ctx.lineTo(-2,-109); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,-109); ctx.lineTo(16,-112); ctx.stroke();

  ctx.strokeStyle="#c62828"; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(-5,-90); ctx.quadraticCurveTo(1,-86,7,-90); ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  ctx.clearRect(-20,-20,W+40,H+40);
  if(bgImg.complete && bgImg.naturalWidth){
    const iw=bgImg.naturalWidth, ih=bgImg.naturalHeight;
    const scale=Math.max(W/iw, H/ih);
    const dw=iw*scale, dh=ih*scale;
    ctx.drawImage(bgImg, (W-dw)/2, (H-dh)/2 - H*0.06, dw, dh);
  }
  const gy=groundY();
  const fade=ctx.createLinearGradient(0,gy-40,0,H);
  fade.addColorStop(0,"rgba(10,20,8,0)");
  fade.addColorStop(1,"rgba(10,20,8,.45)");
  ctx.fillStyle=fade; ctx.fillRect(0,gy-40,W,H-(gy-40));
  ctx.fillStyle="rgba(20,28,16,.55)"; ctx.fillRect(0,gy,W,10);
  balloons.forEach(b=>{if(!b.popped) drawBalloon(b);});
  shots.forEach(s=>{
    ctx.strokeStyle="#e8f7ff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(s.x,s.y1); ctx.lineTo(s.x,s.y2); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.x,s.y2,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#4fc3f7"; ctx.beginPath(); ctx.arc(s.x,s.y2,3,0,Math.PI*2); ctx.fill();
  });
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/40); ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,5,5); ctx.globalAlpha=1;});
  drawPlayer();
  ctx.restore();
}
let drag=null, lastTap=0;
function onPlayer(x,y){
  const b=playerHitBox();
  return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
}
gameEl.addEventListener("pointerdown",e=>{
  if(!running) return;
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  drag={id:e.pointerId,lastX:e.clientX,startX:e.clientX,startY:e.clientY,moved:false,onPlayer:onPlayer(x,y)};
  try{gameEl.setPointerCapture(e.pointerId);}catch(err){}
});
gameEl.addEventListener("pointermove",e=>{
  if(!running||!drag||e.pointerId!==drag.id) return;
  const dx=e.clientX-drag.lastX;
  if(Math.abs(e.clientX-drag.startX)>8 || Math.abs(e.clientY-drag.startY)>8) drag.moved=true;
  if(drag.moved){
    player.x=Math.max(28,Math.min(W-28,player.x+dx));
    drag.lastX=e.clientX;
  }
});
gameEl.addEventListener("pointerup",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.moved && drag.onPlayer){
    const now=performance.now();
    if(now-lastTap<340) fire();
    lastTap=now;
  }
  drag=null;
});
gameEl.addEventListener("pointercancel",()=>{drag=null;});
document.addEventListener("keydown",e=>{
  if(!running) return;
  if(e.key==="ArrowLeft"||e.key==="a") player.x=Math.max(36,player.x-18);
  if(e.key==="ArrowRight"||e.key==="d") player.x=Math.min(W-36,player.x+18);
  if(e.key===" "||e.key==="ArrowUp"){e.preventDefault(); fire();}
});
document.getElementById("start").onclick=start;
document.getElementById("muteBtn").onclick=()=>{
  musicOn=!musicOn; document.getElementById("muteBtn").textContent=musicOn?"♪":"mute";
  if(musicOn) startMusic(); else if(musicTimer) clearTimeout(musicTimer);
};
resize();
</script>
</body>
